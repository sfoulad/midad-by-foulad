    <div class="surah-text"><span epub:type="pagebreak" role="doc-pagebreak" id="page603" title="603"></span>قُلۡ يَٰٓأَيُّهَا ٱلۡكَٰفِرُونَ&#8288;<span class="ayah-number" id="ayah-109-1">١</span>&#x200B;لَآ أَعۡبُدُ مَا تَعۡبُدُونَ&#8288;<span class="ayah-number" id="ayah-109-2">٢</span>&#x200B;وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ&#8288;<span class="ayah-number" id="ayah-109-3">٣</span>&#x200B;وَلَآ أَنَا۠ عَابِدٞ مَّا عَبَدتُّمۡ&#8288;<span class="ayah-number" id="ayah-109-4">٤</span>&#x200B;وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ&#8288;<span class="ayah-number" id="ayah-109-5">٥</span>&#x200B;لَكُمۡ دِينُكُمۡ وَلِيَ دِينِ&#8288;<span class="ayah-number" id="ayah-109-6">٦</span>&#x200B;</div>
