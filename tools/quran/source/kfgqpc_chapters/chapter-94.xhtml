<body>
    <table class="surah-header"><tr>
        <td class="header-info">ترتيبها<br/><span class="header-num plain-num">٩٤</span></td>
        <td class="surah-name" id="surah-94"><span class="surah-glyph" dir="ltr">surah094surah-icon</span></td>
        <td class="header-info">آياتها<br/><span class="header-num plain-num">٨</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">أَلَمۡ نَشۡرَحۡ لَكَ صَدۡرَكَ&#8288;<span class="ayah-number" id="ayah-94-1">١</span>&#x200B;وَوَضَعۡنَا عَنكَ وِزۡرَكَ&#8288;<span class="ayah-number" id="ayah-94-2">٢</span>&#x200B;ٱلَّذِيٓ أَنقَضَ ظَهۡرَكَ&#8288;<span class="ayah-number" id="ayah-94-3">٣</span>&#x200B;وَرَفَعۡنَا لَكَ ذِكۡرَكَ&#8288;<span class="ayah-number" id="ayah-94-4">٤</span>&#x200B;فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا&#8288;<span class="ayah-number" id="ayah-94-5">٥</span>&#x200B;إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا&#8288;<span class="ayah-number" id="ayah-94-6">٦</span>&#x200B;فَإِذَا فَرَغۡتَ فَٱنصَبۡ&#8288;<span class="ayah-number" id="ayah-94-7">٧</span>&#x200B;وَإِلَىٰ رَبِّكَ فَٱرۡغَب&#8288;<span class="ayah-number" id="ayah-94-8">٨</span>&#x200B;</div>
