<body>
    <table class="surah-header"><tr>
        <td class="header-info">ترتيبها<br/><span class="header-num plain-num">١١١</span></td>
        <td class="surah-name" id="surah-111"><span class="surah-glyph" dir="ltr">surah111surah-icon</span></td>
        <td class="header-info">آياتها<br/><span class="header-num plain-num">٥</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">تَبَّتۡ يَدَآ أَبِي لَهَبٖ وَتَبَّ&#8288;<span class="ayah-number" id="ayah-111-1">١</span>&#x200B;مَآ أَغۡنَىٰ عَنۡهُ مَالُهُۥ وَمَا كَسَبَ&#8288;<span class="ayah-number" id="ayah-111-2">٢</span>&#x200B;سَيَصۡلَىٰ نَارٗا ذَاتَ لَهَبٖ&#8288;<span class="ayah-number" id="ayah-111-3">٣</span>&#x200B;وَٱمۡرَأَتُهُۥ حَمَّالَةَ ٱلۡحَطَبِ&#8288;<span class="ayah-number" id="ayah-111-4">٤</span>&#x200B;فِي جِيدِهَا حَبۡلٞ مِّن مَّسَدِۭ&#8288;<span class="ayah-number" id="ayah-111-5">٥</span>&#x200B;</div>
