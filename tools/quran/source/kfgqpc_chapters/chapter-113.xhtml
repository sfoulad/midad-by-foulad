        <td class="header-info">آياتها<br/><span class="header-num plain-num">٥</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ&#8288;<span class="ayah-number" id="ayah-113-1">١</span>&#x200B;مِن شَرِّ مَا خَلَقَ&#8288;<span class="ayah-number" id="ayah-113-2">٢</span>&#x200B;وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ&#8288;<span class="ayah-number" id="ayah-113-3">٣</span>&#x200B;وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِي ٱلۡعُقَدِ&#8288;<span class="ayah-number" id="ayah-113-4">٤</span>&#x200B;وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ&#8288;<span class="ayah-number" id="ayah-113-5">٥</span>&#x200B;</div>
