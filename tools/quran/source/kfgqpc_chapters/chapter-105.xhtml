        <td class="header-info">آياتها<br/><span class="header-num plain-num">٥</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ&#8288;<span class="ayah-number" id="ayah-105-1">١</span>&#x200B;أَلَمۡ يَجۡعَلۡ كَيۡدَهُمۡ فِي تَضۡلِيلٖ&#8288;<span class="ayah-number" id="ayah-105-2">٢</span>&#x200B;وَأَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا أَبَابِيلَ&#8288;<span class="ayah-number" id="ayah-105-3">٣</span>&#x200B;تَرۡمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ&#8288;<span class="ayah-number" id="ayah-105-4">٤</span>&#x200B;فَجَعَلَهُمۡ كَعَصۡفٖ مَّأۡكُولِۭ&#8288;<span class="ayah-number" id="ayah-105-5">٥</span>&#x200B;</div>
