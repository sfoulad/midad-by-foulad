    <div class="surah-text"><span epub:type="pagebreak" role="doc-pagebreak" id="page601" title="601"></span>وَٱلۡعَصۡرِ&#8288;<span class="ayah-number" id="ayah-103-1">١</span>&#x200B;إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ&#8288;<span class="ayah-number" id="ayah-103-2">٢</span>&#x200B;إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ&#8288;<span class="ayah-number" id="ayah-103-3">٣</span>&#x200B;</div>
