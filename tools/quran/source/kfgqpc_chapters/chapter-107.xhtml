<body>
    <table class="surah-header"><tr>
        <td class="header-info">ترتيبها<br/><span class="header-num plain-num">١٠٧</span></td>
        <td class="surah-name" id="surah-107"><span class="surah-glyph" dir="ltr">surah107surah-icon</span></td>
        <td class="header-info">آياتها<br/><span class="header-num plain-num">٧</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">أَرَءَيۡتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ&#8288;<span class="ayah-number" id="ayah-107-1">١</span>&#x200B;فَذَٰلِكَ ٱلَّذِي يَدُعُّ ٱلۡيَتِيمَ&#8288;<span class="ayah-number" id="ayah-107-2">٢</span>&#x200B;وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ&#8288;<span class="ayah-number" id="ayah-107-3">٣</span>&#x200B;فَوَيۡلٞ لِّلۡمُصَلِّينَ&#8288;<span class="ayah-number" id="ayah-107-4">٤</span>&#x200B;ٱلَّذِينَ هُمۡ عَن صَلَاتِهِمۡ سَاهُونَ&#8288;<span class="ayah-number" id="ayah-107-5">٥</span>&#x200B;ٱلَّذِينَ هُمۡ يُرَآءُونَ&#8288;<span class="ayah-number" id="ayah-107-6">٦</span>&#x200B;وَيَمۡنَعُونَ ٱلۡمَاعُونَ&#8288;<span class="ayah-number" id="ayah-107-7">٧</span>&#x200B;</div>
