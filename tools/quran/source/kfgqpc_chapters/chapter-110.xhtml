    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ&#8288;<span class="ayah-number" id="ayah-110-1">١</span>&#x200B;وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجٗا&#8288;<span class="ayah-number" id="ayah-110-2">٢</span>&#x200B;فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا&#8288;<span class="ayah-number" id="ayah-110-3">٣</span>&#x200B;</div>
