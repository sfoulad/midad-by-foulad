    <div class="surah-text"><span epub:type="pagebreak" role="doc-pagebreak" id="page602" title="602"></span>لِإِيلَٰفِ قُرَيۡشٍ&#8288;<span class="ayah-number" id="ayah-106-1">١</span>&#x200B;إِۦلَٰفِهِمۡ رِحۡلَةَ ٱلشِّتَآءِ وَٱلصَّيۡفِ&#8288;<span class="ayah-number" id="ayah-106-2">٢</span>&#x200B;فَلۡيَعۡبُدُواْ رَبَّ هَٰذَا ٱلۡبَيۡتِ&#8288;<span class="ayah-number" id="ayah-106-3">٣</span>&#x200B;ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ&#8288;<span class="ayah-number" id="ayah-106-4">٤</span>&#x200B;</div>
