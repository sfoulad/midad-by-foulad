        <td class="header-info">آياتها<br/><span class="header-num plain-num">٦</span></td>
    </tr></table>
    <table class="bismillah-table"><tr><td class="bismillah">﷽</td></tr></table>
    <div class="surah-text">قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-1">١</span>&#x200B;مَلِكِ ٱلنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-2">٢</span>&#x200B;إِلَٰهِ ٱلنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-3">٣</span>&#x200B;مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-4">٤</span>&#x200B;ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-5">٥</span>&#x200B;مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ&#8288;<span class="ayah-number" id="ayah-114-6">٦</span>&#x200B;</div>
