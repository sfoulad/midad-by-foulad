name: Compile Release Candidate

on:
  workflow_dispatch:

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release_rc
            asset: firmware.bin
          - pio_env: sticky-gh_release_rc
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release_rc
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release_rc
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Extract env
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BRANCH_SUFFIX=${GITHUB_REF_NAME#release/}" >> $GITHUB_ENV
          echo "CROSSPOINT_VERSION=$(grep -m1 '^version = ' platformio.ini | cut -d' ' -f3)" >> $GITHUB_ENV

      - name: Build CrossPoint Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Install espsecure
        # Pinned to the exact version validated in Phase 1 Milestone 2 (real sign+
        # verify round-trip run against it, not just --help). Do not bump casually:
        # espsecure's CLI has changed command syntax across major versions before
        # (underscored subcommands -> hyphenated, .py suffix -> bare command) --
        # confirm scripts/sign_firmware.sh's exact invocation still matches first.
        run: uv pip install --system esptool==4.12.0

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: ./scripts/sign_firmware.sh ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}" ota-signing-public-key.pem

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}-${{ matrix.pio_env }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # Settings -> System -> Pre-release opts a device into checking GitHub's
          # full /releases list (includes pre-releases) instead of /releases/latest,
          # which GitHub documents as excluding pre-releases/drafts entirely -- this
          # step is what actually makes an RC build visible there at all; the CI
          # artifact above was previously the only output. tag_name doesn't need to
          # already exist: action-gh-release creates it pointing at this workflow's
          # own commit. Same per-board asset-naming convention as the stable release
          # workflow (see release.yml) so ReleaseJsonParser/OtaUpdater need no
          # per-channel special-casing.
          tag_name: v${{ env.CROSSPOINT_VERSION }}-rc+${{ env.SHORT_SHA }}
          prerelease: true
          files: .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
