name: Compile Release Candidate

on:
  workflow_dispatch:

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Extract env
        run: |
          {
            echo "SHORT_SHA=${GITHUB_SHA::7}"
            echo "BRANCH_SUFFIX=${GITHUB_REF_NAME#release/}"
            echo "CROSSPOINT_VERSION=$(grep -m1 '^version = ' platformio.ini | cut -d' ' -f3)"
          } >> "$GITHUB_ENV"

      - name: Build CrossPoint Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e gh_release_rc

      - name: Install espsecure
        # Pinned to the exact version validated in Phase 1 Milestone 2 (real sign+
        # verify round-trip run against it, not just --help). Do not bump casually:
        # espsecure's CLI has changed command syntax across major versions before
        # (underscored subcommands -> hyphenated, .py suffix -> bare command) --
        # confirm scripts/sign_firmware.sh's exact invocation still matches first.
        run: uv pip install --system esptool==4.12.0

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: ./scripts/sign_firmware.sh .pio/build/gh_release_rc/firmware.bin ota-signing-public-key.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}
          path: |
            .pio/build/gh_release_rc/bootloader.bin
            .pio/build/gh_release_rc/firmware.bin
            .pio/build/gh_release_rc/firmware.elf
            .pio/build/gh_release_rc/firmware.map
            .pio/build/gh_release_rc/partitions.bin

      - name: Publish GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          # Settings -> System -> Pre-release opts a device into checking GitHub's
          # full /releases list (includes pre-releases) instead of /releases/latest,
          # which GitHub documents as excluding pre-releases/drafts entirely -- this
          # step is what actually makes an RC build visible there at all; the CI
          # artifact above was previously the only output. tag_name doesn't need to
          # already exist: action-gh-release creates it pointing at this workflow's
          # own commit. Same firmware.bin-only asset convention as the stable release
          # workflow (see release.yml) so ReleaseJsonParser/OtaUpdater need no
          # per-channel special-casing.
          tag_name: v${{ env.CROSSPOINT_VERSION }}-rc+${{ env.SHORT_SHA }}
          prerelease: true
          files: .pio/build/gh_release_rc/firmware.bin
