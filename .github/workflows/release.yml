name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release:
# crosspoint-<version>-<device>.bin, where <version> is the tag without its
# leading "v" and the combined C3 X4/X3 image uses the device tag x3-x4.
# Attaches the built .bin files to the release as-is -- CrossPoint's standard
# unsigned firmware format, no cryptographic firmware authentication.

on:
  release:
    types: [published]

env:
  # Pins the core that the platform installs into its own penv at build time.
  # See scripts/uv-constraints.txt -- without it the firmware is built by an
  # unpinned PyPI core fetched after the integrity check has already passed.
  UV_CONSTRAINT: ${{ github.workspace }}/scripts/uv-constraints.txt

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            rc_env: gh_release_rc
            device: x3-x4
          - release_env: sticky-gh_release
            rc_env: sticky-gh_release_rc
            device: sticky
          - release_env: x4pro-gh_release
            rc_env: x4pro-gh_release_rc
            device: x4pro
          - release_env: x4c-gh_release
            rc_env: x4c-gh_release_rc
            device: x4c
          - release_env: papermono-gh_release
            rc_env: papermono-gh_release_rc
            device: papermono
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      # Adopted from CrossPoint 1.6.5rc's release workflow, adapted to Midad's
      # tag scheme. Upstream compares the tag to platformio.ini's version and
      # appends a bare "rc" for prereleases; Midad tags carry a build suffix
      # (v1.8.58-rc+<sha>), so the suffix is stripped before comparing rather
      # than the version having "rc" appended to it.
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          tag_version="${tag%%-*}"
          configured="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ "$tag_version" != "$configured" ]; then
            echo "Release tag $RELEASE_TAG does not match platformio.ini version $configured" >&2
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "true" ] && [ "$tag" = "$tag_version" ]; then
            echo "Prerelease $RELEASE_TAG carries no -rc suffix" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: false

      - name: Install PlatformIO Core and Python dependencies
        run: uv pip install --system --require-hashes -r scripts/requirements-ci.lock

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          # Every input that decides which packages get installed is in the key, and
          # there is deliberately no restore-keys: a partial match would layer a new
          # platform/core over packages resolved for an older one, which is how a
          # mid-build core migration (and an unverified scons) got in.
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.lock', 'scripts/platformio-packages-lock.json', 'scripts/uv-constraints.txt') }}

      - name: Verify PlatformIO package integrity
        # Issue #179: PlatformIO's own PackageManager does not checksum-verify
        # external/URI package downloads (the platform archive, frameworks,
        # toolchains, build tools) -- only its Library Registry path is
        # checksummed. This closes that gap before any of that content is
        # installed/compiled: fails closed on any hash mismatch, and works
        # identically whether the cache above was restored or not (falls back
        # to a fresh download+verify per package on an empty runner).
        run: python3 scripts/verify_platformio_packages.py

      - name: Build CrossPoint
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
        run: CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="crosspoint-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: |
            ${{ steps.asset.outputs.name }}
            .pio/build/${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}/bootloader.bin
            .pio/build/${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}/firmware.elf
            .pio/build/${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}/firmware.map
            .pio/build/${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}/partitions.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # OtaUpdater.cpp looks up releases/latest and matches an asset named
          # exactly crosspoint-<version>-<device>.bin, where <version> is the tag
          # without its leading "v" -- devices only see an update once this step
          # runs, the CI artifact above is not enough. Only the named asset per
          # board is attached here; bootloader.bin/firmware.elf/firmware.map/
          # partitions.bin are still available via the CI artifact above for local
          # debugging, just not cluttering the public release.
          files: ${{ steps.asset.outputs.name }}
