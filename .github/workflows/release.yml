name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release: plain
# firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for every other
# board. Every board's binary is signed the same way (see scripts/sign_firmware.sh)
# before it's attached to the release -- OTA_SIGNING_KEY missing is a hard
# failure per-board, never a silent skip.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
          - pio_env: sticky-gh_release
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: false

      - name: Install PlatformIO Core and Python dependencies
        run: uv pip install --system --require-hashes -r scripts/requirements-ci.lock

      - name: Cache PlatformIO packages
        # Namespaced separately from ci.yml's `pio-*` cache: this job signs firmware
        # with OTA_SIGNING_KEY, so it must never restore a cache entry that untrusted
        # PR-triggered CI could have populated (cache poisoning). The prefixes never
        # overlap, so a restore-keys prefix match can't cross between them in either
        # direction.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          key: signed-release-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: signed-release-pio-${{ runner.os }}-

      - name: Verify PlatformIO package integrity
        # Issue #179: PlatformIO's own PackageManager does not checksum-verify
        # external/URI package downloads (the platform archive, frameworks,
        # toolchains, build tools) -- only its Library Registry path is
        # checksummed. This closes that gap before any of that content is
        # installed/compiled: fails closed on any hash mismatch, and works
        # identically whether the cache above was restored or not (falls back
        # to a fresh download+verify per package on an empty runner).
        run: python3 scripts/verify_platformio_packages.py

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Refuse a stable release signed with a pre-production-custody key
        # Enforced counterpart to ota-signing-key-status.md (see
        # docs/ota-production-key-ceremony.md's "Pre-production mode"): that
        # file is committed alongside a public key provisioned with reduced
        # (single-iCloud-backup) custody via `ota-key-ceremony.sh
        # --preproduction`, authorized for CI / signed RC generation /
        # hardware qualification only -- never a stable release. This is the
        # *stable* release path (triggered by a version tag push), unlike
        # auto-release.yml/release_candidate.yml (RC paths, where a
        # pre-production key is exactly what's authorized); it must never
        # silently sign with a key this file marks as not-yet-production-
        # custody. Fails closed: the file's absence means no pre-production
        # key is currently marked live, so the stable release proceeds.
        run: |
          set -euo pipefail
          if [ -f ota-signing-key-status.md ]; then
            echo "::error::ota-signing-key-status.md is present at this tag, marking the committed ota-signing-public-key.pem (and the OTA_SIGNING_KEY secret it corresponds to) as PRE-PRODUCTION custody -- authorized for CI, signed RC generation, and hardware qualification only, not a stable release (see docs/ota-production-key-ceremony.md). Refusing to publish. Retire this file only after a deliberate custody upgrade or key rotation (docs/ota-signing-key-management.md's key rotation procedure), never just to silence this check."
            exit 1
          fi

      - name: Verify espsecure version
        # esptool==4.12.0 comes from scripts/requirements-ci.lock now -- no
        # second install here. Pinned to the exact version validated in
        # Phase 1 Milestone 2 (real sign+verify round-trip, not just --help).
        # Do not bump casually: espsecure's CLI has changed command syntax
        # across major versions before (underscored subcommands ->
        # hyphenated, .py suffix -> bare command) -- confirm
        # scripts/sign_firmware.sh's exact invocation still matches first.
        run: |
          set -euo pipefail
          actual="$(python3 -c "import esptool; print(esptool.__version__)")"
          echo "esptool $actual"
          [ "$actual" = "4.12.0" ] || { echo "::error::Expected esptool 4.12.0, got: $actual"; exit 1; }

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: ./scripts/sign_firmware.sh ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}" ota-signing-public-key.pem

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # OtaUpdater.cpp looks up releases/latest and matches an asset named
          # exactly "firmware.bin" (ReleaseJsonParser.cpp:47) for the primary C3
          # board, and firmware-<board>.bin for every other board -- devices only
          # see an update once this step runs, the CI artifact above is not enough.
          # Only the named asset per board is attached here; bootloader.bin/
          # firmware.elf/firmware.map/partitions.bin are still available via the
          # CI artifact above for local debugging, just not cluttering the public
          # release.
          files: .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
