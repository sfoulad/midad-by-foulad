name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release: plain
# firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for every other
# board. Every board's binary is signed the same way (see scripts/sign_firmware.sh)
# before it's attached to the release -- OTA_SIGNING_KEY missing is a hard
# failure per-board, never a silent skip.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
          - pio_env: sticky-gh_release
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Install espsecure
        # Pinned to the exact version validated in Phase 1 Milestone 2 (real sign+
        # verify round-trip run against it, not just --help). Do not bump casually:
        # espsecure's CLI has changed command syntax across major versions before
        # (underscored subcommands -> hyphenated, .py suffix -> bare command) --
        # confirm scripts/sign_firmware.sh's exact invocation still matches first.
        run: uv pip install --system esptool==4.12.0

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: ./scripts/sign_firmware.sh ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}" ota-signing-public-key.pem

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # OtaUpdater.cpp looks up releases/latest and matches an asset named
          # exactly "firmware.bin" (ReleaseJsonParser.cpp:47) for the primary C3
          # board, and firmware-<board>.bin for every other board -- devices only
          # see an update once this step runs, the CI artifact above is not enough.
          # Only the named asset per board is attached here; bootloader.bin/
          # firmware.elf/firmware.map/partitions.bin are still available via the
          # CI artifact above for local debugging, just not cluttering the public
          # release.
          files: .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
