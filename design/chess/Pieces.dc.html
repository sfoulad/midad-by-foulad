<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Inter, "Helvetica Neue", Arial, sans-serif; background: #e8e6e1; color: #111; }
    a { color: #000; } a:hover { color: #333; }
    .cell { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; position: relative; }
    .dark { background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 4px 4px; }
    .light { background: #fff; }
    .badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; font-family: Georgia, 'Times New Roman', serif; box-sizing: border-box; }
  </style>
</helmet>
<div style="padding: 32px; display: flex; flex-direction: column; gap: 28px; width: 1580px; box-sizing: border-box">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 22px; font-weight: 700">Piece styles on 1-bit e-ink</div>
    <div style="font-size: 14px">Each set at the real 56 px square, white and black pieces on light and dithered dark squares. Final glyphs become 42×42 1-bpp bitmaps, so anything thinner than 2 px or any grey disappears.</div>
  </div>
  <div style="display: flex; gap: 40px; align-items: flex-start">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px; width: 344px">
        <div style="font-size: 16px; font-weight: 700">{{s.name}}</div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid #000; width: 338px">
          <sc-for list="{{s.cells}}" as="c" hint-placeholder-count="24">
            <div class="cell {{c.sq}}">
              <sc-if value="{{c.isGlyph}}" hint-placeholder-val="{{true}}">
                <svg width="42" height="42" viewBox="0 0 40 40" style="display: block">
                  <path d="{{c.d}}" fill="{{c.fill}}" stroke="{{c.outline}}" stroke-width="{{c.sw}}" stroke-linejoin="round" stroke-linecap="round"></path>
                  <path d="{{c.detail}}" fill="none" stroke="{{c.dstroke}}" stroke-width="{{c.sw}}" stroke-linecap="round"></path>
                </svg>
              </sc-if>
              <sc-if value="{{c.isBadge}}" hint-placeholder-val="{{false}}">
                <div class="badge" style="background: {{c.fill}}; color: {{c.dstroke}}; border: 2.5px solid #000">{{c.letter}}</div>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div style="font-size: 13px; line-height: 18px; text-wrap: pretty">{{s.pro}}</div>
        <div style="font-size: 13px; line-height: 18px; text-wrap: pretty; color: #444">{{s.con}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1580,"height":560}}'>
const BLOCK = {
  p: 'M20 8a5 5 0 1 1 0 10a5 5 0 1 1 0-10ZM15 20h10l2 8H13ZM10 30h20v5H10Z',
  r: 'M10 6h5v5h4V6h2v5h4V6h5v9h-2v13h2v6H10v-6h2V15h-2Z',
  n: 'M12 34h18v-4c-2-2-3-4-3-8c0-6-4-11-9-13l-3 4l-3-1l1 5c-3 2-3 6-1 9l4-3v6c-2 1-4 3-4 5Z',
  b: 'M20 5c5 5 8 10 8 15c0 4-3 7-8 7s-8-3-8-7c0-5 3-10 8-15ZM10 34h20v-3l-4-4H14l-4 4Z',
  q: 'M6 12l6 12l3-14l5 12l5-12l3 14l6-12l-4 18H10ZM10 32h20v4H10Z',
  k: 'M18 3h4v4h4v4h-4v3h-4v-3h-4V7h4ZM12 16h16c4 3 4 9 0 12H12c-4-3-4-9 0-12ZM10 30h20v5H10Z'
};
const STAUNTON = {
  p: { d: 'M20 6a4.5 4.5 0 1 0 .01 0ZM17 15h6l1.5 4h-9ZM15 19h10c1 4 3.5 7 3.5 10h-17c0-3 2.5-6 3.5-10ZM11 31h18v4H11Z', detail: 'M13 31h14' },
  r: { d: 'M11 6h4v4h3V6h4v4h3V6h4v8h-2v13h2v3H11v-3h2V14h-2ZM11 30h18v5H11Z', detail: 'M14 14h12M14 27h12' },
  n: { d: 'M11 36H29V33C29 27 27 24 27 20C27 13 23 8 18 7L16 4L14 7C11 9 9 12 8 16L7 19L10 20L9 23L13 23C11 26 10 29 10 32C10 33 10.5 34.5 11 36Z', detail: 'M15 12a1.2 1.2 0 1 0 .01 0M22 12c3 5 3 10 3 16M13 33h14' },
  b: { d: 'M20 4a2.2 2.2 0 1 0 .01 0ZM20 9c5 4 7 9 7 13c0 3-2 5-7 5s-7-2-7-5c0-4 2-9 7-13ZM14 28h12l2 3H12ZM11 33h18v3H11Z', detail: 'M20 15l-3 6' },
  q: { d: 'M8 11l5 10l3-12l4 9l4-9l3 12l5-10l-3 17H11ZM11 30h18v6H11Z', detail: 'M12 26h16M13 33h14' },
  k: { d: 'M18 3h4v3h3v4h-3v3h-4v-3h-3V6h3ZM14 14h12c4 3 5 9 2 13H12c-3-4-2-10 2-13ZM11 29h18v6H11Z', detail: 'M14 20c3-2 9-2 12 0M13 29h14' }
};
const ROUNDED = {
  p: { d: 'M20 9.5a4 4 0 1 1 0 8a4 4 0 1 1 0-8ZM18 17.5h4l.5 2h2l-1.5 2c2 2 3 4.5 3 7.5h2a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h2c0-3 1-5.5 3-7.5l-1.5-2h2Z', detail: 'M12 29h16' },
  r: { d: 'M12 5h4v3h2V5h4v3h2V5h4v7l-1.5 2v11l1.5 2v2a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2v-2l1.5-2V14L12 12Z', detail: 'M13.5 14h13M12 29h16' },
  n: { d: 'M13 29c-1-4 0-8 3-11c-2 0-4 1-5.5 2.5l-2.5-1.5l-1-2.5l4-5c2.5-2.5 5-4 8-4.5l1.5-3l2 3.5c4.5 1.5 7 5.5 7 10.5V29a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h1Z', detail: 'M15.5 12.5a1 1 0 1 0 .01 0M12 29h16' },
  b: { d: 'M20 3a2.5 2.5 0 1 1 0 5a2.5 2.5 0 1 1 0-5ZM20 8c5.5 4 8 9.5 8 14.5c0 2.5-.5 4.5-1.5 6.5h1.5a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h1.5c-1-2-1.5-4-1.5-6.5C12 17.5 14.5 12 20 8Z', detail: 'M22.5 12l-3.5 11M12 29h16' },
  q: { d: 'M12 29L9 13.5q.5-2.5 2-1L13.5 18L14 9.5q.5-2.5 2-1L18 16.5L19 6.5q1-2.5 2 0L22 16.5L24 8.5q1.5-1.5 2 1L26.5 18L29 12.5q1.5-1.5 2 1L28 29a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2Z', detail: 'M12 29h16' },
  k: { d: 'M18 2h4v3.5h3.5v4H22V13h-4V9.5h-3.5v-4H18ZM13 14c-4 0-5 6-2 9l1.5 6h-.5a2 2 0 0 0-2 2v5h20v-5a2 2 0 0 0-2-2h-.5l1.5-6c3-3 2-9-2-9c-2.5 0-4.5 1-6 2.5h-3C17.5 15 15.5 14 13 14Z', detail: 'M15 19.5l2.5 3.5M25 19.5l-2.5 3.5M12 29h16' }
};
const LETTER = { k: 'K', q: 'Q', r: 'R', b: 'B', n: 'N', p: 'P' };
const ORDER = ['k', 'q', 'r', 'b', 'n', 'p'];
const ROWS = [ { w: true, sq: 'light' }, { w: true, sq: 'dark' }, { w: false, sq: 'light' }, { w: false, sq: 'dark' } ];

class Component extends DCLogic {
  build(kind) {
    const cells = [];
    ROWS.forEach(row => ORDER.forEach(p => {
      const fill = row.w ? '#fff' : '#000', dstroke = row.w ? '#000' : '#fff';
      if (kind === 'block') cells.push({ sq: row.sq, isGlyph: true, isBadge: false, d: BLOCK[p], detail: '', fill, dstroke, sw: row.w ? 2.4 : 2, outline: '#000' });
      else if (kind === 'staunton') cells.push({ sq: row.sq, isGlyph: true, isBadge: false, d: STAUNTON[p].d, detail: STAUNTON[p].detail, fill, dstroke, sw: 2, outline: '#000' });
      else if (kind === 'rounded') cells.push({ sq: row.sq, isGlyph: true, isBadge: false, d: ROUNDED[p].d, detail: ROUNDED[p].detail, fill, dstroke, sw: 1.5, outline: dstroke });
      else cells.push({ sq: row.sq, isGlyph: false, isBadge: true, letter: LETTER[p], fill, dstroke });
    }));
    return cells;
  }
  renderVals() {
    return { sets: [
      { name: 'A · Block silhouettes', cells: this.build('block'), pro: 'Bold shapes survive downsampling and dithering; black vs white reads instantly at arm’s length.', con: 'Knight and bishop are the weakest, and black pieces on dark squares lose their edge without a 2 px white halo.' },
      { name: 'B · Staunton outline', cells: this.build('staunton'), pro: 'Familiar tournament look; inner detail lines (drawn white on black pieces) keep both colours distinct on any square.', con: 'Detail lines are at the limit of 1-bit at 42 px; needs hand-tuning per bitmap, not just a downsample.' },
      { name: 'C · Letter badges', cells: this.build('letter'), pro: 'Unambiguous for beginners, matches the SAN move list (N, B, R…), trivially crisp on e-ink, and text renders from the existing font.', con: 'Less chess-like; a board full of circles feels like a diagram. Could be the fallback for a “large / clear” accessibility setting.' }
      ,{ name: 'D · Rounded icon set — CHOSEN', cells: this.build('rounded'), pro: '1.5 px outline (black on white pieces, white on black pieces so they lift off dark squares), rounded bases: reads at a glance and rasterises cleanly to 1-bit.', con: 'King cross is the only fine feature; the 1.5 px outline rounds up to 2 px in the 1-bit bitmap.' }
    ] };
  }
}
</script>
</body>
</html>
