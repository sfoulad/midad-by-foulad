<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Inter, "Helvetica Neue", Arial, sans-serif; background: #e8e6e1; }
    a { color: #000; } a:hover { color: #333; }
    .screen { width: 480px; height: 800px; background: #fff; color: #000; position: relative; overflow: hidden; image-rendering: pixelated; }
    .hdr { position: absolute; top: 5px; left: 0; width: 480px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
    .batt { position: absolute; right: 12px; top: 10px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 400; }
    .cell { width: 56px; height: 56px; position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .dark { background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 4px 4px; }
    .hint { position: absolute; bottom: 0; height: 40px; width: 106px; border: 1px solid #000; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; background: #fff; }
    .key { min-width: 44px; height: 44px; border: 1.5px solid #333; border-radius: 8px; background: #f4f2ee; display: flex; align-items: center; justify-content: center; font-size: 13px; padding: 0 12px; cursor: pointer; user-select: none; }
    .key:active { background: #d9d6cf; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px; width: 512px; box-sizing: border-box">
  <div class="screen" style="border: 2px solid #111">
    <div class="hdr"><span>Chess</span>
      <div class="batt"><span>82%</span><svg width="15" height="12" viewBox="0 0 15 12"><rect x="0.5" y="0.5" width="12" height="11" fill="none" stroke="#000"/><rect x="13" y="3.5" width="2" height="5" fill="#000"/><rect x="2" y="2" width="8" height="8" fill="#000"/></svg></div>
    </div>

    <div style="position: absolute; left: 16px; top: 54px; width: 450px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 700">Omar</span><span style="font-size: 13px">~1200</span></div>
      <div style="display: flex; align-items: center; gap: 4px">
        <div style="display: flex">
          <sc-for list="{{capByEngine}}" as="x" hint-placeholder-count="2">
            <svg width="22" height="22" viewBox="0 0 40 40" style="display: block"><path d="{{x.d}}" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="round"></path><path d="{{x.dt}}" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"></path></svg>
          </sc-for>
        </div>
        <span style="font-size: 13px; font-weight: 700; min-width: 20px">{{matEngine}}</span>
      </div>
    </div>
    </div>
    <div style="position: absolute; left: 16px; top: 538px; width: 450px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 700">You</span><span style="font-size: 13px">White</span></div>
      <div style="display: flex; align-items: center; gap: 4px">
        <div style="display: flex">
          <sc-for list="{{capByYou}}" as="x" hint-placeholder-count="2">
            <svg width="22" height="22" viewBox="0 0 40 40" style="display: block"><path d="{{x.d}}" fill="#000" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"></path><path d="{{x.dt}}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"></path></svg>
          </sc-for>
        </div>
        <span style="font-size: 13px; font-weight: 700; min-width: 20px">{{matYou}}</span>
      </div>
    </div>
    </div>
    <div style="position: absolute; left: 16px; top: 86px; width: 448px; height: 448px; border: 1px solid #000; box-sizing: content-box; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr))">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
        <div class="cell {{c.cls}}" style="border: {{c.border}}">
          <sc-if value="{{c.hasPiece}}" hint-placeholder-val="{{true}}">
            <svg width="42" height="42" viewBox="0 0 40 40" style="display: block">
              <path d="{{c.d}}" fill="{{c.fill}}" stroke="{{c.ds}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
              <path d="{{c.dt}}" fill="none" stroke="{{c.ds}}" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </sc-if>
          <sc-if value="{{c.dot}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; left: 22px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: #000"></div>
          </sc-if>
          <sc-if value="{{c.ring}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; left: 3px; top: 3px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #000; box-sizing: border-box"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>


    <div style="position: absolute; left: 60px; top: 198px; width: 360px; background: #fff; border: 3px solid #000; padding: 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center">
      <div style="font-size: 22px; font-weight: 700">Checkmate — You win</div>
      <div style="font-size: 14px">Beat Omar (~1200) in 4 moves</div>
      <div style="font-size: 13px">Record vs Omar: 6 W · 2 L · 1 D</div>
      <div style="height: 1px; width: 100%; background: #000"></div>
      <div style="display: flex; flex-direction: column; width: 100%">
        <div style="height: 30px; background: #000; color: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 16px">Play again</div>
        <div style="height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 16px">Review moves</div>
        <div style="height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 16px">Back to menu</div>
      </div>
    </div>

    <div style="position: absolute; left: 16px; top: 578px; width: 450px; display: flex; flex-direction: column; gap: 6px; font-size: 16px">
      <div style="height: 1px; background: #000"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; font-family: 'Courier New', monospace; font-size: 15px; min-height: 72px">
        <sc-for list="{{moveRows}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px"><span style="width: 32px; text-align: right">{{m.n}}.</span><span style="width: 90px">{{m.w}}</span><span style="width: 90px">{{m.b}}</span></div>
        </sc-for>
      </div>
      <div style="font-size: 16px; font-weight: 700; min-height: 22px; padding-top: 4px">{{status}}</div>
    </div>

    <div class="hint" style="left: 25px">Menu</div>
    <div class="hint" style="left: 130px">Select</div>
    <div class="hint" style="left: 245px">Up</div>
    <div class="hint" style="left: 350px">Down</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":512,"height":860}}'>
const PATH = {
  p: 'M20 9.5a4 4 0 1 1 0 8a4 4 0 1 1 0-8ZM18 17.5h4l.5 2h2l-1.5 2c2 2 3 4.5 3 7.5h2a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h2c0-3 1-5.5 3-7.5l-1.5-2h2Z',
  r: 'M12 5h4v3h2V5h4v3h2V5h4v7l-1.5 2v11l1.5 2v2a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2v-2l1.5-2V14L12 12Z',
  n: 'M13 29c-1-4 0-8 3-11c-2 0-4 1-5.5 2.5l-2.5-1.5l-1-2.5l4-5c2.5-2.5 5-4 8-4.5l1.5-3l2 3.5c4.5 1.5 7 5.5 7 10.5V29a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h1Z',
  b: 'M20 3a2.5 2.5 0 1 1 0 5a2.5 2.5 0 1 1 0-5ZM20 8c5.5 4 8 9.5 8 14.5c0 2.5-.5 4.5-1.5 6.5h1.5a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2h1.5c-1-2-1.5-4-1.5-6.5C12 17.5 14.5 12 20 8Z',
  q: 'M12 29L9 13.5q.5-2.5 2-1L13.5 18L14 9.5q.5-2.5 2-1L18 16.5L19 6.5q1-2.5 2 0L22 16.5L24 8.5q1.5-1.5 2 1L26.5 18L29 12.5q1.5-1.5 2 1L28 29a2 2 0 0 1 2 2v5H10v-5a2 2 0 0 1 2-2Z',
  k: 'M18 2h4v3.5h3.5v4H22V13h-4V9.5h-3.5v-4H18ZM13 14c-4 0-5 6-2 9l1.5 6h-.5a2 2 0 0 0-2 2v5h20v-5a2 2 0 0 0-2-2h-.5l1.5-6c3-3 2-9-2-9c-2.5 0-4.5 1-6 2.5h-3C17.5 15 15.5 14 13 14Z'
};
const DETAIL = {
  p: 'M12 29h16',
  r: 'M13.5 14h13M12 29h16',
  n: 'M15.5 12.5a1 1 0 1 0 .01 0M12 29h16',
  b: 'M22.5 12l-3.5 11M12 29h16',
  q: 'M12 29h16',
  k: 'M15 19.5l2.5 3.5M25 19.5l-2.5 3.5M12 29h16'
};
const FINAL = ['r.bqkb.r','pppp.Qpp','..n..n..','....p...','..B.P...','........','PPPP.PPP','RNB.K.NR'].map(r => r.split(''));
const MOVES = ['e4','e5','Bc4','Nc6','Qh5','Nf6','Qxf7#'];
class Component extends DCLogic {
  isW(ch) { return ch !== '.' && ch === ch.toUpperCase(); }
  renderVals() {
    const cells = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const p = FINAL[r][c], mate = (r === 1 && c === 5) || (r === 0 && c === 4);
      cells.push({ cls: (r + c) % 2 ? 'dark' : '', border: mate ? '3px solid #000' : '0 solid transparent', hasPiece: p !== '.', d: p !== '.' ? PATH[p.toLowerCase()] : '', dt: p !== '.' ? DETAIL[p.toLowerCase()] : '', fill: this.isW(p) ? '#fff' : '#000', ds: this.isW(p) ? '#000' : '#fff', dot: false, ring: false });
    }
    const moveRows = [];
    for (let i = 0; i < MOVES.length; i += 2) moveRows.push({ n: i / 2 + 1, w: MOVES[i], b: MOVES[i + 1] || '' });
    return { cells, moveRows: moveRows.slice(-3), status: 'Checkmate', capByYou: [{ d: PATH.p, dt: DETAIL.p }], capByEngine: [], matYou: '+1', matEngine: '' };
  }
}
</script>
</body>
</html>
