[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.8.57

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; useStlAlgorithm is suppressed deliberately, not out of convenience: it advises
; replacing raw loops with std::transform/accumulate/any_of, and every such
; substitution instantiates another function template. On a 380KB-RAM ESP32-C3
; with no PSRAM that trades flash and DRAM for no runtime benefit, which is the
; opposite of what CLAUDE.md's "Template and std::function Bloat" rule asks for.
; The advice is sound on a desktop target and wrong here.
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=useStlAlgorithm --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; Firmware-embedded Quran EPUB (tools/quran/build_quran_epub.py) -- see src/QuranBook.h
board_build.embed_files = data/quran.epub

; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/patch_wolfssl_midad.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  ; NimBLE-Arduino, not esp-nimble-cpp: carries the arduino-esp32 3.3.7
  ; controller-init fix (see freeink-sdk/libs/network/BleKeyboardHost's own
  ; library.json note, and docs/ble-module-tasks.md). Used by both
  ; lib/hal/BlePeripheralManager (peripheral role, phone control) and,
  ; later, BleKeyboardHost (central role, page-turner) if that capability
  ; is enabled -- one shared dependency, only one role active at runtime
  ; per docs/ble-module-tasks.md's mutual-exclusion design.
  h2zero/NimBLE-Arduino @ ^2.3.8
  wolfssl/Arduino-wolfSSL @ 5.7.2

; Excludes the Arduino-ESP32 core's bundled Bluedroid-based "BLE" library so it
; can never get pulled in alongside NimBLE-Arduino above -- the two BLE stacks
; conflict if both are linked. Complementary to the NimBLE-Arduino choice, not
; opposed to it: Midad's BLE feature (lib/hal/BlePeripheralManager) is built on
; NimBLE, never the ignored one.
lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

; Debug-only: measures wolfSSL's real per-connection heap cost (CTX creation +
; CA-bundle parse + TLS 1.3 handshake) at three CA-bundle sizes, to ground a
; future setInsecure() -> real certificate verification decision. Boots
; straight into TlsHeapMeasureActivity instead of normal home/reader routing
; (see main.cpp) -- never flash this for daily use. TLS_HEAP_MEASURE_HARNESS
; is defined ONLY here; every other env is structurally unaffected.
;   pio run -e default_tls_measure -t upload
[env:default_tls_measure]
extends = env:default
build_flags =
  ${env:default.build_flags}
  -DTLS_HEAP_MEASURE_HARNESS=1
  ; scripts/git_branch.py only injects CROSSPOINT_VERSION for PIOENV in
  ; ('default', 'sticky'); set it explicitly here (same pattern as
  ; gh_release/slim below) so HalSystem.cpp's use of the macro still compiles.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-tls-measure\"


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; Desktop simulator (github.com/crosspoint-reader/crosspoint-simulator) — renders the
; e-ink display in an SDL2 window on the host, no device required. Requires `brew
; install sdl2` on macOS. Run with: pio run -e simulator -t run_simulator
[env:simulator]
platform = native
build_src_filter =
  +<*>
  ; These get host-backed equivalents/no-op shims from the simulator library.
  -<network/CrossPointWebServer.cpp>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<network/WebDAVHandler.cpp>
  -<platform/skip_efuse_blk_check.c>
  ; ESP-IDF bootloader-only (esp_secure_boot.h, __wrap_esp_secure_boot_init_checks
  ; link-time wrap): PR #163's boot-time OTA-signing guard has no host equivalent
  ; and was never added to this exclusion list, breaking every simulator build
  ; since it landed.
  -<OtaSigningBootGuard.cpp>
  ; No simulator-side counterpart for lib/hal/BlePeripheralManager (see
  ; docs/ble-module-tasks.md) -- unlike the network/ files above, this one has no
  ; host-backed shim to fall back to, since BLE peripheral advertising has no
  ; meaningful desktop equivalent. main.cpp's own call into this is already guarded
  ; by #ifndef SIMULATOR, so excluding the whole translation unit is safe: nothing
  ; simulator-compiled ever references BleCommandDispatcher::pump().
  -<BleCommandDispatcher.cpp>
  ; Same rationale as BleCommandDispatcher.cpp above: BleWifiScanCache.cpp calls
  ; BlePeripheralManager::end() directly (radio-ownership handoff), so it now
  ; needs BlePeripheralManager.h too. main.cpp's own call into
  ; BleWifiScanCache::tick() is already guarded by #ifndef SIMULATOR.
  -<BleWifiScanCache.cpp>
  ; Same rationale, same shape as BleWifiScanCache.cpp above -- BleWifiAutoConnectCache.cpp
  ; also calls BlePeripheralManager::end() directly. main.cpp's own call into
  ; BleWifiAutoConnectCache::tick() is already guarded by #ifndef SIMULATOR.
  -<BleWifiAutoConnectCache.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
lib_ldf_mode = deep+
lib_ignore = hal, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  ; Both required by src/components/UiAppHost.h/UiAppHelpers.h (FreeInkApp.h) --
  ; upstream CrossPoint has the same dependency and documents both symlink
  ; entries in the simulator library's own sample-platformio-*.ini, but they
  ; were never carried over into this project's [env:simulator]/[env:simulator_x3].
  ; Not a stale simulator pin (the fetched simulator commit already matches
  ; crosspoint-reader/crosspoint-simulator's current HEAD) -- purely a missing
  ; local lib_deps declaration.
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  links2004/WebSockets @ 2.7.3

; Same simulator, but reports X3 (792px, narrower) to HalGPIO::deviceIsX3() instead
; of the [env:simulator] default of X4 (800px) -- needed to catch X3-only layout bugs
; (e.g. kashida/justification math that happens to work at 800px but not 792px)
; that [env:simulator] alone can never exercise, since real X3 hardware wasn't
; available to test directly. Duplicated rather than `extends`ing [env:simulator]
; directly (extends only reliably pulls in shared [base]-style sections in this
; PlatformIO version, not another concrete [env:*]'s extra_scripts/build_src_filter --
; extending it silently dropped extra_scripts, failing the gen_i18n.py pre-script).
; Run with: pio run -e simulator_x3 -t run_simulator
[env:simulator_x3]
platform = native
build_src_filter =
  +<*>
  ; These get host-backed equivalents/no-op shims from the simulator library.
  -<network/CrossPointWebServer.cpp>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<network/WebDAVHandler.cpp>
  -<platform/skip_efuse_blk_check.c>
  ; ESP-IDF bootloader-only (esp_secure_boot.h, __wrap_esp_secure_boot_init_checks
  ; link-time wrap): PR #163's boot-time OTA-signing guard has no host equivalent
  ; and was never added to this exclusion list, breaking every simulator build
  ; since it landed.
  -<OtaSigningBootGuard.cpp>
  ; No simulator-side counterpart for lib/hal/BlePeripheralManager (see
  ; docs/ble-module-tasks.md) -- unlike the network/ files above, this one has no
  ; host-backed shim to fall back to, since BLE peripheral advertising has no
  ; meaningful desktop equivalent. main.cpp's own call into this is already guarded
  ; by #ifndef SIMULATOR, so excluding the whole translation unit is safe: nothing
  ; simulator-compiled ever references BleCommandDispatcher::pump().
  -<BleCommandDispatcher.cpp>
  ; Same rationale as BleCommandDispatcher.cpp above: BleWifiScanCache.cpp calls
  ; BlePeripheralManager::end() directly (radio-ownership handoff), so it now
  ; needs BlePeripheralManager.h too. main.cpp's own call into
  ; BleWifiScanCache::tick() is already guarded by #ifndef SIMULATOR.
  -<BleWifiScanCache.cpp>
  ; Same rationale, same shape as BleWifiScanCache.cpp above -- BleWifiAutoConnectCache.cpp
  ; also calls BlePeripheralManager::end() directly. main.cpp's own call into
  ; BleWifiAutoConnectCache::tick() is already guarded by #ifndef SIMULATOR.
  -<BleWifiAutoConnectCache.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DSIMULATOR_DEVICE_X3
  -DCROSSPOINT_VERSION=\"dev-simulator-x3\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
lib_ldf_mode = deep+
lib_ignore = hal, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  ; Both required by src/components/UiAppHost.h/UiAppHelpers.h (FreeInkApp.h) --
  ; upstream CrossPoint has the same dependency and documents both symlink
  ; entries in the simulator library's own sample-platformio-*.ini, but they
  ; were never carried over into this project's [env:simulator]/[env:simulator_x3].
  ; Not a stale simulator pin (the fetched simulator commit already matches
  ; crosspoint-reader/crosspoint-simulator's current HEAD) -- purely a missing
  ; local lib_deps declaration.
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  links2004/WebSockets @ 2.7.3

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

; Sticky/S3 counterpart to default_tls_measure -- same TlsHeapMeasureActivity/
; TlsHeapMeasureCaBundles source, just compiled for the S3/Xtensa board instead
; of C3/RISC-V, since default_tls_measure extends env:default and cannot run on
; this MCU family. Never flash this for daily use.
;   pio run -e sticky_tls_measure -t upload
[env:sticky_tls_measure]
extends = env:sticky
build_flags =
  ${env:sticky.build_flags}
  -DTLS_HEAP_MEASURE_HARNESS=1
  ; scripts/git_branch.py only injects CROSSPOINT_VERSION for PIOENV in
  ; ('default', 'sticky'); set it explicitly here (same pattern as
  ; default_tls_measure above and gh_release/slim below) so HalSystem.cpp's
  ; use of the macro still compiles.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-tls-measure\"

[env:sticky-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:sticky-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; Minimal X4 Pro target: the SDK profile supplies the board pinout, display,
; touch controller, and capacitive Home key.
;   pio run -e x4pro -t upload
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Frontlight PWM clocked from RC_FAST with KEEP_ALIVE so it survives light
  ; sleep (freeink-sdk FREEINK_FRONTLIGHT_LS); pairs with the HalPowerManager
  ; change that stops a lit frontlight from blocking sleep.
  -DFREEINK_FRONTLIGHT_LS

[env:x4pro-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_FRONTLIGHT_LS

[env:x4pro-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_FRONTLIGHT_LS

; --- M5Stack Paper Mono — ESP32-S3, SSD1683 800x480 + FT6336 touch + frontlight
; Power/reset plumbing runs through the M5PM1 PMIC and M5IOE1 expander; the SDK
; sequences them itself. Touch, frontlight, RTC, and other capabilities are
; selected by the Paper Mono BoardConfig profile.
;   pio run -e papermono -t upload
[env:papermono]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  ; The SSD1683 grayscale target planes are batched in PSRAM.
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-papermono\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; Native 1-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:papermono-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:papermono-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
